<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="Helvetica, Arial, sans-serif"><circle cx="320" cy="310" r="200" fill="none" stroke="#94a3b8" stroke-width="3"/><line x1="90" y1="310" x2="550" y2="310" stroke="#b45309" stroke-width="3" stroke-dasharray="8 6"/><text x="40" y="296" font-size="14" fill="#475569" font-style="italic">ordinary</text><text x="40" y="332" font-size="14" fill="#1e3a8a" font-style="italic">special</text><circle cx="320" cy="110" r="14" fill="#1d4ed8"/><text x="320" y="115" font-size="13" fill="white" text-anchor="middle" font-weight="bold">1</text><text x="320" y="64" font-size="13" fill="#334155" text-anchor="middle">Ordinary world</text><circle cx="420" cy="137" r="14" fill="#1d4ed8"/><text x="420" y="142" font-size="13" fill="white" text-anchor="middle" font-weight="bold">2</text><text x="440" y="96" font-size="13" fill="#334155" text-anchor="start">Call to adventure</text><circle cx="493" cy="210" r="14" fill="#1d4ed8"/><text x="493" y="215" font-size="13" fill="white" text-anchor="middle" font-weight="bold">3</text><text x="528" y="184" font-size="13" fill="#334155" text-anchor="start">Refusal</text><circle cx="520" cy="310" r="14" fill="#b45309"/><text x="520" y="315" font-size="13" fill="white" text-anchor="middle" font-weight="bold">4</text><text x="560" y="314" font-size="13" fill="#334155" text-anchor="start">Meeting the mentor</text><circle cx="493" cy="410" r="14" fill="#b45309"/><text x="493" y="415" font-size="13" fill="white" text-anchor="middle" font-weight="bold">5</text><text x="528" y="444" font-size="13" fill="#334155" text-anchor="start">Crossing the threshold</text><circle cx="420" cy="483" r="14" fill="#1d4ed8"/><text x="420" y="488" font-size="13" fill="white" text-anchor="middle" font-weight="bold">6</text><text x="440" y="532" font-size="13" fill="#334155" text-anchor="start">Tests, allies, enemies</text><circle cx="320" cy="510" r="14" fill="#1d4ed8"/><text x="320" y="515" font-size="13" fill="white" text-anchor="middle" font-weight="bold">7</text><text x="320" y="564" font-size="13" fill="#334155" text-anchor="middle">Approach</text><circle cx="220" cy="483" r="14" fill="#1d4ed8"/><text x="220" y="488" font-size="13" fill="white" text-anchor="middle" font-weight="bold">8</text><text x="200" y="532" font-size="13" fill="#334155" text-anchor="end">Ordeal</text><circle cx="147" cy="410" r="14" fill="#1d4ed8"/><text x="147" y="415" font-size="13" fill="white" text-anchor="middle" font-weight="bold">9</text><text x="112" y="444" font-size="13" fill="#334155" text-anchor="end">Reward</text><circle cx="120" cy="310" r="14" fill="#1d4ed8"/><text x="120" y="315" font-size="13" fill="white" text-anchor="middle" font-weight="bold">10</text><text x="80" y="314" font-size="13" fill="#334155" text-anchor="end">The road back</text><circle cx="147" cy="210" r="14" fill="#1d4ed8"/><text x="147" y="215" font-size="13" fill="white" text-anchor="middle" font-weight="bold">11</text><text x="112" y="184" font-size="13" fill="#334155" text-anchor="end">Resurrection</text><circle cx="220" cy="137" r="14" fill="#1d4ed8"/><text x="220" y="142" font-size="13" fill="white" text-anchor="middle" font-weight="bold">12</text><text x="200" y="96" font-size="13" fill="#334155" text-anchor="end">Return with the elixir</text><text x="320" y="300" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">your talk ends about here</text><text x="320" y="322" font-size="13" fill="#475569" text-anchor="middle">the audience decides whether to cross</text></svg>
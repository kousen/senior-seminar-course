<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="Helvetica, Arial, sans-serif"><circle cx="410" cy="300" r="190" fill="none" stroke="#94a3b8" stroke-width="3"/><line x1="180" y1="300" x2="640" y2="300" stroke="#b45309" stroke-width="3" stroke-dasharray="8 6"/><text x="30" y="262" font-size="14" fill="#475569" font-style="italic">ordinary world</text><text x="30" y="350" font-size="14" fill="#1e3a8a" font-style="italic">special world</text><circle cx="410" cy="110" r="15" fill="#1d4ed8"/><text x="410" y="115" font-size="13" fill="white" text-anchor="middle" font-weight="bold">1</text><text x="410" y="72" font-size="14" text-anchor="middle" fill="#334155">Ordinary world</text><circle cx="505" cy="135" r="15" fill="#1d4ed8"/><text x="505" y="140" font-size="13" fill="white" text-anchor="middle" font-weight="bold">2</text><text x="520" y="101" font-size="14" text-anchor="start" fill="#334155">Call to adventure</text><circle cx="575" cy="205" r="15" fill="#1d4ed8"/><text x="575" y="210" font-size="13" fill="white" text-anchor="middle" font-weight="bold">3</text><text x="601" y="182" font-size="14" text-anchor="start" fill="#334155">Refusal of the call</text><circle cx="600" cy="300" r="15" fill="#b45309"/><text x="600" y="305" font-size="13" fill="white" text-anchor="middle" font-weight="bold">4</text><text x="630" y="305" font-size="14" text-anchor="start" font-weight="bold" fill="#b45309">Meeting the mentor</text><circle cx="575" cy="395" r="15" fill="#b45309"/><text x="575" y="400" font-size="13" fill="white" text-anchor="middle" font-weight="bold">5</text><text x="601" y="426" font-size="14" text-anchor="start" font-weight="bold" fill="#b45309">Crossing the threshold</text><circle cx="505" cy="465" r="15" fill="#1d4ed8"/><text x="505" y="470" font-size="13" fill="white" text-anchor="middle" font-weight="bold">6</text><text x="520" y="507" font-size="14" text-anchor="start" fill="#334155">Tests, allies, enemies</text><circle cx="410" cy="490" r="15" fill="#1d4ed8"/><text x="410" y="495" font-size="13" fill="white" text-anchor="middle" font-weight="bold">7</text><text x="410" y="536" font-size="14" text-anchor="middle" fill="#334155">Approach</text><circle cx="315" cy="465" r="15" fill="#1d4ed8"/><text x="315" y="470" font-size="13" fill="white" text-anchor="middle" font-weight="bold">8</text><text x="300" y="507" font-size="14" text-anchor="end" fill="#334155">Ordeal</text><circle cx="245" cy="395" r="15" fill="#1d4ed8"/><text x="245" y="400" font-size="13" fill="white" text-anchor="middle" font-weight="bold">9</text><text x="219" y="426" font-size="14" text-anchor="end" fill="#334155">Reward</text><circle cx="220" cy="300" r="15" fill="#1d4ed8"/><text x="220" y="305" font-size="13" fill="white" text-anchor="middle" font-weight="bold">10</text><text x="190" y="305" font-size="14" text-anchor="end" fill="#334155">The road back</text><circle cx="245" cy="205" r="15" fill="#1d4ed8"/><text x="245" y="210" font-size="13" fill="white" text-anchor="middle" font-weight="bold">11</text><text x="219" y="182" font-size="14" text-anchor="end" fill="#334155">Resurrection</text><circle cx="315" cy="135" r="15" fill="#1d4ed8"/><text x="315" y="140" font-size="13" fill="white" text-anchor="middle" font-weight="bold">12</text><text x="300" y="101" font-size="14" text-anchor="end" fill="#334155">Return with the elixir</text><text x="410" y="288" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">your talk ends about here</text><text x="410" y="314" font-size="13" fill="#475569" text-anchor="middle">the audience decides whether to cross</text></svg>
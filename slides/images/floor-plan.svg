<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="440" height="380" font-family="Helvetica, Arial, sans-serif">
<!-- a sketched floor plan with memory pins: places trigger stories -->
<g fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round">
<rect x="20" y="20" width="400" height="300"/>
<line x1="220" y1="20" x2="220" y2="140"/><line x1="220" y1="190" x2="220" y2="320"/>
<line x1="20" y1="170" x2="120" y2="170"/><line x1="160" y1="170" x2="220" y2="170"/>
<line x1="300" y1="200" x2="420" y2="200"/>
</g>
<g font-size="14" fill="#475569"><text x="40" y="50">kitchen</text><text x="240" y="50">living room</text><text x="40" y="200">bedroom</text><text x="320" y="230">closet</text><text x="240" y="300">front door</text></g>
<g font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">
<circle cx="120" cy="110" r="14" fill="#f59e0b"/><text x="120" y="115">1</text>
<circle cx="330" cy="120" r="14" fill="#f59e0b"/><text x="330" y="125">2</text>
<circle cx="110" cy="260" r="14" fill="#f59e0b"/><text x="110" y="265">3</text>
<circle cx="370" cy="265" r="14" fill="#b45309"/><text x="370" y="270">4</text>
</g>
<text x="220" y="352" text-anchor="middle" font-size="15" fill="#1e3a8a">walk room to room; pin every memory that surfaces</text>
</svg>

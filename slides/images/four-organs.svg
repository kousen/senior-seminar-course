<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" width="440" height="420" font-family="Helvetica, Arial, sans-serif">
<!-- Olson's four organs as a vertical scale, analytical at top, emotional below -->
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
<rect x="30" y="20" width="14" height="380" rx="7" fill="url(#g)"/>
<text x="37" y="14" font-size="12" fill="#1e3a8a" text-anchor="middle">logic</text>
<text x="37" y="416" font-size="12" fill="#b45309" text-anchor="middle">passion</text>
<g font-size="20">
<rect x="70" y="24" width="350" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="90" y="56" fill="#1e3a8a" font-weight="bold">Head</text><text x="90" y="82" font-size="14" fill="#475569">analysis, evidence, "think before you act"</text>
<rect x="70" y="118" width="350" height="76" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="90" y="150" fill="#1e3a8a" font-weight="bold">Heart</text><text x="90" y="176" font-size="14" fill="#475569">feeling, sincerity, what they care about</text>
<rect x="70" y="212" width="350" height="76" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="90" y="244" fill="#1e3a8a" font-weight="bold">Gut</text><text x="90" y="270" font-size="14" fill="#475569">humor, instinct, hunches</text>
<rect x="70" y="306" width="350" height="76" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="90" y="338" fill="#1e3a8a" font-weight="bold">Groin</text><text x="90" y="364" font-size="14" fill="#475569">raw desire; power, no logic at all</text>
</g>
</svg>

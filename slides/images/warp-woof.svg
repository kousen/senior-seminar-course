<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" font-family="Helvetica, Arial, sans-serif">
<!-- warp: vertical theme threads -->
<g stroke="#1d4ed8" stroke-width="6" stroke-linecap="round">
<line x1="110" y1="40" x2="110" y2="290"/><line x1="160" y1="40" x2="160" y2="290"/><line x1="210" y1="40" x2="210" y2="290"/><line x1="260" y1="40" x2="260" y2="290"/><line x1="310" y1="40" x2="310" y2="290"/><line x1="360" y1="40" x2="360" y2="290"/>
</g>
<!-- woof: horizontal story threads weaving over and under -->
<g stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none">
<path d="M80 80 Q110 60 135 80 T185 80 T235 80 T285 80 T335 80 T385 80"/>
<path d="M80 150 Q110 170 135 150 T185 150 T235 150 T285 150 T335 150 T385 150"/>
<path d="M80 220 Q110 200 135 220 T185 220 T235 220 T285 220 T335 220 T385 220"/>
</g>
<text x="235" y="320" font-size="15" fill="#1d4ed8" text-anchor="middle">warp: the theme and its evidence</text>
<text x="405" y="85" font-size="14" fill="#b45309">story</text>
<text x="405" y="155" font-size="14" fill="#b45309">story</text>
<text x="405" y="225" font-size="14" fill="#b45309">the rag doll, again</text>
<text x="20" y="25" font-size="14" fill="#475569">woof: the stories shuttle back and forth</text>
</svg>

      <text y="120">Her</text>
      <text y="180" font-size="11" fill="#6b7280">one OS,</text>
      <text y="195" font-size="11" fill="#6b7280">8,316 conversations</text>
    </g>
    <g transform="translate(335,0)">
      <circle cx="0" cy="150" r="7" fill="#1d4ed8"/>
      <text y="100" font-weight="700" fill="#1e3a8a">2017</text>
      <text y="120">Replika</text>
      <text y="180" font-size="11" fill="#6b7280">born from a dead</text>

      <text y="180" font-size="11" fill="#6b7280">200 lines of script</text>
      <text y="195" font-size="11" fill="#6b7280">people confide in it</text>
    </g>
    <g transform="translate(205,0)">
      <circle cx="0" cy="150" r="7" fill="#f59e0b"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <line x1="30" y1="150" x2="885" y2="150" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arr)"/>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <g transform="translate(75,0)">
      <circle cx="0" cy="150" r="7" fill="#f59e0b"/>

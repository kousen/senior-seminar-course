<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif">
<text x="30" y="35" font-size="17" fill="#1e3a8a" font-weight="bold">Ten minutes, alternating</text>
<line x1="30" y1="200" x2="730" y2="200" stroke="#94a3b8" stroke-width="2"/>
<g font-size="13" text-anchor="middle">
<rect x="30" y="140" width="90" height="60" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="75" y="166" fill="#b45309">a person</text><text x="75" y="184" fill="#b45309">waiting</text>
<rect x="130" y="80" width="110" height="120" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="185" y="136" fill="#1e3a8a">the system</text><text x="185" y="154" fill="#1e3a8a">today, the data</text>
<rect x="250" y="140" width="90" height="60" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="295" y="166" fill="#b45309">why the</text><text x="295" y="184" fill="#b45309">line dropped</text>
<rect x="350" y="80" width="130" height="120" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="415" y="136" fill="#1e3a8a">the approach,</text><text x="415" y="154" fill="#1e3a8a">architecture</text>
<rect x="490" y="140" width="90" height="60" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="535" y="166" fill="#b45309">the demo,</text><text x="535" y="184" fill="#b45309">live</text>
<rect x="590" y="80" width="80" height="120" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="630" y="136" fill="#1e3a8a">the plan,</text><text x="630" y="154" fill="#1e3a8a">the risks</text>
<rect x="680" y="140" width="50" height="60" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="705" y="175" fill="#b45309">the ask</text>
</g>
<g font-size="14">
<rect x="30" y="235" width="18" height="18" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="56" y="249" fill="#1e3a8a">analytical: diagram, data, process, evidence</text>
<rect x="400" y="235" width="18" height="18" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="426" y="249" fill="#b45309">emotional: story, benefit, image, demo, surprise</text>
</g>
<text x="30" y="285" font-size="14" fill="#475569">Screenwriters want an emotional shift in every scene. Aim for one every two minutes.</text>
</svg>
